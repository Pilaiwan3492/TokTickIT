name: CI Test & Build Battery

on:
  push:
    branches:
      - main
      - lab4-staging
      - feature/39-final-regression-submission
      - 'feature/**'
  pull_request:
    branches:
      - main
      - lab4-staging

jobs:
  client:
    name: Client Build & Vitest (181 Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run client tests (181 tests)
        run: npm test -- --run

      - name: Build client production bundle
        run: npm run build

  server:
    name: Server Build & Vitest (309 Tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: toktickit
          POSTGRES_PASSWORD: toktickit
          POSTGRES_DB: toktickit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://toktickit:toktickit@localhost:5432/toktickit?schema=public
      JWT_SECRET: ci-secret-token-at-least-32-characters-long-12345
      PORT: 3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Push Prisma Schema
        run: npx prisma db push --skip-generate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Seed database
        run: npm run prisma:seed

      - name: Run server tests (309 tests)
        run: npm test -- --run

      - name: Build server
        run: npm run build

  e2e:
    name: Playwright Multi-Device E2E (57 Tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: toktickit
          POSTGRES_PASSWORD: toktickit
          POSTGRES_DB: toktickit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://toktickit:toktickit@localhost:5432/toktickit?schema=public
      JWT_SECRET: ci-secret-token-at-least-32-characters-long-12345
      PORT: 3000
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Setup server environment
        run: |
          echo 'DATABASE_URL="postgresql://toktickit:toktickit@localhost:5432/toktickit?schema=public"' > server/.env
          echo 'PORT=3000' >> server/.env
          echo 'JWT_SECRET="ci-secret-token-at-least-32-characters-long-12345"' >> server/.env

      - name: Push Prisma Schema & Seed database
        run: |
          npx prisma db push --skip-generate
          npx prisma generate
          npm run prisma:seed
        working-directory: server

      - name: Install root dependencies & Playwright runner
        run: |
          npm install @playwright/test@^1.63.0 playwright@^1.63.0 bcryptjs @types/bcryptjs --no-save

      - name: Install Playwright Chromium & system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Multi-Device E2E Suite (57 Tests)
        run: npx playwright test e2e/lab-04/
